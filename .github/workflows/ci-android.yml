name: Android Native CI
on:
  push:
    paths: ['apps/android/**', 'core/rust/**', '.github/workflows/ci-android.yml']
  pull_request:
    paths: ['apps/android/**', 'core/rust/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Setup Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust Core (.so) for Android ABIs
        working-directory: core/rust
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          RUSTFLAGS: "-C link-arg=-Wl,-soname,libsecurevault_core.so"
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../../apps/android/app/src/main/jniLibs \
            build --release

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          RUSTFLAGS: "-C link-arg=-Wl,-soname,libsecurevault_core.so"
        run: gradle -p apps/android assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-Android-Debug-APK
          path: apps/android/app/build/outputs/apk/debug/*.apk
