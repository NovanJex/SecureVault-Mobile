name: Suoxia
options:
  bundleIdPrefix: app.suoxia
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en

targets:
  Suoxia:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Suoxia
        excludes:
          - Info.plist
          - Bridge/module.modulemap
    info:
      path: Suoxia/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.suoxia.vault
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Suoxia/Bridge"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../core/rust/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Libs"
        OTHER_LDFLAGS: "-lsecurevault_core"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
